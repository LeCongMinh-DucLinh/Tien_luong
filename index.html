<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tính Thu Nhập CB, GV, NV Ngành Giáo Dục 5.0</title>

<style>

:root{
    --primary:#0b3d91;
    --secondary:#eaf2ff;
    --success:#0f9d58;
    --danger:#d93025;
    --border:#d6e2f5;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f4f8ff;
    font-family:Segoe UI, Arial, sans-serif;
    color:#333;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 3px 12px rgba(0,0,0,0.1);
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    color:var(--primary);
    margin-bottom:5px;
    font-size:clamp(18px, 4vw, 24px);
    line-height:1.2;
}

.header p{
    color:#666;
    margin:0;
}

.section{
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
    background:white;
}

.section-title{
    text-align:center;
    color:#0b3d91;
    font-weight:700;
    font-size:20px;
    margin-bottom:15px;
    padding-bottom:8px;
    border-bottom:2px solid #dbe7ff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr));
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:5px;
    font-weight:600;
    color:var(--primary);
}

input,
select,
textarea{
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
    width: 100%;
}

textarea{
    resize:vertical;
}

.button-group{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap: wrap;
}

.btn{
    border:none;
    border-radius:8px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
    width:220px;
    text-align: center;
}

.btn-primary{ background:var(--primary); color:white; }
.btn-danger{ background:var(--danger); color:white; }
.btn-success{ background:var(--success); color:white; }

.result-section{ display:none; }

.result-table{
    width:100%;
    border-collapse:collapse;
    margin-top:8px;
}

.result-table th,
.result-table td{
    border:1px solid #dbe4f0;
    padding:6px 10px;
    font-size: 13px;
}

.result-table th{ background:var(--secondary); }
.result-table td:last-child{ text-align:right; }

.total-income{
    font-size:16px;
    font-weight:bold;
    color:var(--success);
    text-align:right;
    margin-top:10px;
}

.notice{
    margin-top:5px;
    font-size:11px;
    color:#666;
    font-style: italic;
}

.footer{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#666;
}

.hidden{ display:none !important; }

.signature{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

.signature-box{
    text-align:center;
    width:200px;
    font-size: 12px;
}

.cut-line {
    display: none;
}

@media (max-width:768px){
    body { padding: 10px; }
    .container { padding: 15px; }
    .grid{ grid-template-columns: 1fr; gap: 12px; }
    .button-group { flex-direction: column; width: 100%; gap: 10px; }
    .btn { width: 100%; padding: 14px; }
}

/* ==================== CẤU HÌNH IN TỐI ƯU 2 PHIẾU / 1 TRANG A4 ==================== */
@media print{
    @page {
        size: A4 portrait;
        margin: 8mm 10mm;
    }

    body{
        background:white;
        padding:0;
        margin:0;
        font-size: 12px;
    }

    .no-print, .footer{
        display:none !important;
    }

    .container{
        box-shadow:none;
        border:none;
        padding:0;
        margin:0;
        width: 100%;
    }

    .result-section{
        display:block !important;
        border: none;
        padding: 0;
        margin: 0;
    }

    .pay-stub {
        padding: 5px 0;
        page-break-inside: avoid;
    }

    .pay-stub .section-title {
        font-size: 16px;
        margin-bottom: 8px;
        padding-bottom: 4px;
    }

    .pay-stub p {
        margin: 3px 0;
        font-size: 12px;
    }

    .result-table th, .result-table td {
        padding: 4px 6px;
        font-size: 11px;
    }

    .total-income {
        font-size: 14px;
        margin-top: 6px;
    }

    .cut-line {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 12px 0;
        color: #888;
        font-size: 12px;
    }

    .cut-line::before, .cut-line::after {
        content: '';
        flex: 1;
        border-bottom: 1px dashed #999;
    }

    .cut-line span {
        padding: 0 10px;
    }

    .signature {
        margin-top: 15px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="header no-print">
    <h1>TÍNH THU NHẬP CB, GV, NV NGÀNH GIÁO DỤC 5.0</h1>
    <p>Lương cơ sở mặc định: 2.530.000 đồng</p>
</div>

<div class="section no-print">
    <div class="section-title">THÔNG TIN CÁ NHÂN</div>
    <div class="grid">
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" id="hoTen">
        </div>

        <div class="form-group">
            <label>Đơn vị công tác</label>
            <input type="text" id="donVi">
        </div>

        <div class="form-group">
            <label>Đối tượng</label>
            <select id="doiTuong" onchange="capNhatGiaoDien()">
                <option value="gv">Giáo viên</option>
                <option value="tpt">Giáo viên Tổng phụ trách</option>
                <option value="cbql">Cán bộ quản lý</option>
                <option value="nv">Nhân viên</option>
            </select>
        </div>
    </div>
</div>

<div class="section no-print">
    <div class="section-title">THÔNG TIN LƯƠNG VÀ PHỤ CẤP</div>
    <div class="grid"> 
        <div class="form-group">
            <label>Lương cơ sở (VNĐ)</label>
            <input type="number" id="luongCoSo" value="2530000">
        </div>

        <div class="form-group">
            <label>Hệ số lương</label>
            <input type="number" step="0.01" id="heSoLuong">
        </div>

        <div class="form-group">
            <label>Hệ số đặc thù</label>
            <input type="number" step="0.01" id="heSoDacThu" value="1.00" placeholder="Ví dụ: 1.15 hoặc 1.25">
        </div>

        <div class="form-group">
            <label>Phụ cấp ưu đãi (%)</label>
            <input type="number" id="pcUuDai" value="0">
        </div>

        <div class="form-group">
            <label>Phụ cấp thâm niên (%)</label>
            <input type="number" id="pcThamNien" value="0">
        </div>

        <div class="form-group">
            <label>Phụ cấp vượt khung (%)</label>
            <input type="number" id="pcVuotKhung" value="0">
        </div>

        <div class="form-group">
            <label>Phụ cấp khu vực (Hệ số)</label>
            <input type="number" step="0.01" id="pcKhuVuc" value="0">
        </div>
    </div>
</div>

<div id="khoiChucVu" class="section no-print hidden">
    <div class="section-title">PHỤ CẤP CHỨC VỤ</div>
    <div class="form-group">
        <label>Phụ cấp chức vụ (Hệ số)</label>
        <input type="number" step="0.01" id="pcChucVu" value="0">
    </div>
</div>

<div id="khoiTrachNhiem" class="section no-print hidden">
    <div class="section-title">PHỤ CẤP TRÁCH NHIỆM</div>
    <div class="form-group">
        <label>Phụ cấp trách nhiệm (Hệ số)</label>
        <input type="number" step="0.01" id="pcTrachNhiem" value="0">
    </div>
</div>

<div id="khoiNhanVien" class="section no-print hidden">
    <div class="section-title">PHỤ CẤP NHÂN VIÊN</div>
    <div class="grid" style="align-items: center;">
        <div style="display: flex; gap: 8px; align-items: center;">
            <input type="checkbox" id="coTrachNhiem" onchange="capNhatNhanVien()" style="width: auto;">
            <label for="coTrachNhiem" style="margin-bottom: 0;">Có phụ cấp trách nhiệm</label>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
            <input type="checkbox" id="coDocHai" onchange="capNhatNhanVien()" style="width: auto;">
            <label for="coDocHai" style="margin-bottom: 0;">Có phụ cấp độc hại</label>
        </div>
    </div>
    
    <br>

    <div id="oTrachNhiemNhanVien" class="form-group hidden">
        <label>Phụ cấp trách nhiệm (Hệ số)</label>
        <input type="number" step="0.01" id="pcTrachNhiemNV" value="0">
    </div>

    <div id="oDocHai" class="form-group hidden" style="margin-top: 12px;">
        <label>Phụ cấp độc hại (Hệ số)</label>
        <input type="number" step="0.01" id="pcDocHai" value="0">
    </div>
</div>

<div class="section no-print">
    <div class="section-title">GHI CHÚ</div>
    <textarea rows="3" id="ghiChu" placeholder="Ghi chú thêm nếu cần..."></textarea>
</div>

<div class="section no-print">
    <div class="button-group">
        <button class="btn btn-primary" onclick="tinhLuong()">TÍNH TOÁN THU NHẬP</button>
        <button class="btn btn-danger" onclick="xoaDuLieu()">XÓA DỮ LIỆU</button>
        <button class="btn btn-success" onclick="window.print()">IN PHIẾU LƯƠNG (2 BẢN / A4)</button>
    </div>
</div>

<div id="ketQua" class="section result-section"></div>

<div class="footer">
    © 2026 - Công cụ tính thu nhập CB, GV, NV ngành GD
    <br>
    phát triển bởi <strong>Lê Công Minh</strong>  
</div>

</div>

<script>

function formatVND(num){
    return Math.round(num).toLocaleString('vi-VN') + ' đ';
}

function capNhatGiaoDien(){
    const doiTuong = document.getElementById('doiTuong').value;

    document.getElementById('khoiChucVu').classList.add('hidden');
    document.getElementById('khoiTrachNhiem').classList.add('hidden');
    document.getElementById('khoiNhanVien').classList.add('hidden');

    if(doiTuong === 'cbql'){
        document.getElementById('khoiChucVu').classList.remove('hidden');
    }
    if(doiTuong === 'tpt'){
        document.getElementById('khoiTrachNhiem').classList.remove('hidden');
    }
    if(doiTuong === 'nv'){
        document.getElementById('khoiNhanVien').classList.remove('hidden');
    }
}

function capNhatNhanVien(){
    document.getElementById('oTrachNhiemNhanVien').classList.toggle('hidden', !document.getElementById('coTrachNhiem').checked);
    document.getElementById('oDocHai').classList.toggle('hidden', !document.getElementById('coDocHai').checked);
}

function taoNoiDungPhieu(hoTen, donVi, ngay, hsl, hsDacThu, luongChinhDacThu, pcUuDai, pcThamNien, pcChucVu, pcKhuVuc, pcTrachNhiem, pcDocHai, tongThuNhap, bhxh, bhyt, bhtn, thucNhan, ghiChu) {
    return `
        <div class="pay-stub">
            <div class="section-title">PHIẾU TÍNH THU NHẬP CÁ NHÂN</div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span><b>Họ và tên:</b> ${hoTen || '............................'}</span>
                <span><b>Ngày lập:</b> ${ngay}</span>
            </div>
            <p><b>Đơn vị công tác:</b> ${donVi || '........................................................'}</p>

            <table class="result-table">
                <tr>
                    <th>Khoản thu nhập</th>
                    <th>Số tiền</th>
                    <th>Khoản khấu trừ</th>
                    <th>Số tiền</th>
                </tr>
                <tr>
                    <td>Lương chính đặc thù (${hsl} × ${hsDacThu})</td>
                    <td>${formatVND(luongChinhDacThu)}</td>
                    <td>BHXH (8%)</td>
                    <td>${formatVND(bhxh)}</td>
                </tr>
                <tr>
                    <td>Phụ cấp ưu đãi</td>
                    <td>${formatVND(pcUuDai)}</td>
                    <td>BHYT (1,5%)</td>
                    <td>${formatVND(bhyt)}</td>
                </tr>
                <tr>
                    <td>Phụ cấp thâm niên</td>
                    <td>${formatVND(pcThamNien)}</td>
                    <td>BHTN (1%)</td>
                    <td>${formatVND(bhtn)}</td>
                </tr>
                <tr>
                    <td>Phụ cấp chức vụ / Trách nhiệm</td>
                    <td>${formatVND(pcChucVu + pcTrachNhiem)}</td>
                    <th style="text-align:left;">TỔNG KHẤU TRỪ</th>
                    <th>${formatVND(bhxh + bhyt + bhtn)}</th>
                </tr>
                <tr>
                    <td>Các phụ cấp khác (KV, Độc hại)</td>
                    <td>${formatVND(pcKhuVuc + pcDocHai)}</td>
                    <td colspan="2" rowspan="2" style="vertical-align:middle; text-align:center; background:#f9fbfd;">
                        <div class="total-income">THỰC NHẬN:<br>${formatVND(thucNhan)}</div>
                    </td>
                </tr>
                <tr>
                    <th>TỔNG THU NHẬP</th>
                    <th>${formatVND(tongThuNhap)}</th>
                </tr>
            </table>

            ${ghiChu ? `<p style="margin-top:4px;"><b>Ghi chú:</b> ${ghiChu}</p>` : ''}

            <div class="signature">
                <div class="signature-box">
                    <strong>Người lập phiếu</strong>
                    <br><br><br>
                    (Ký, ghi rõ họ tên)
                </div>
                <div class="signature-box">
                    <strong>Người nhận phiếu</strong>
                    <br><br><br>
                    (Ký, ghi rõ họ tên)
                </div>
            </div>
        </div>
    `;
}

function tinhLuong(){
    const lcs = parseFloat(document.getElementById('luongCoSo').value) || 0;
    const hsl = parseFloat(document.getElementById('heSoLuong').value) || 0;
    const hsDacThu = parseFloat(document.getElementById('heSoDacThu').value) || 1;

    if(hsl <= 0){
        alert('Vui lòng nhập hệ số lương hợp lệ');
        return;
    }

    const pcUuDaiPct = parseFloat(document.getElementById('pcUuDai').value) || 0;
    const pcThamNienPct = parseFloat(document.getElementById('pcThamNien').value) || 0;
    const pcVuotKhungPct = parseFloat(document.getElementById('pcVuotKhung').value) || 0;
    const pcKhuVucHs = parseFloat(document.getElementById('pcKhuVuc').value) || 0;
    const pcChucVuHs = parseFloat(document.getElementById('pcChucVu').value) || 0;
    const pcTrachNhiemHs = parseFloat(document.getElementById('pcTrachNhiem').value) || 0;
    const pcTrachNhiemNVHs = parseFloat(document.getElementById('pcTrachNhiemNV').value) || 0;
    const pcDocHaiHs = parseFloat(document.getElementById('pcDocHai').value) || 0;
    const doiTuong = document.getElementById('doiTuong').value;

    const luongNghachBacGoc = hsl * lcs;
    const luongChinhDacThu = hsl * hsDacThu * lcs;

    let pcChucVu = 0;
    let pcTrachNhiem = 0;
    let pcDocHai = 0;

    if(doiTuong === 'cbql'){
        pcChucVu = pcChucVuHs * lcs;
    }
    if(doiTuong === 'tpt'){
        pcTrachNhiem = pcTrachNhiemHs * lcs;
    }
    if(doiTuong === 'nv'){
        if(document.getElementById('coTrachNhiem').checked){
            pcTrachNhiem = pcTrachNhiemNVHs * lcs;
        }
        if(document.getElementById('coDocHai').checked){
            pcDocHai = pcDocHaiHs * lcs;
        }
    }

    const pcKhuVuc = pcKhuVucHs * lcs;
    const gocPhuCap = luongNghachBacGoc + pcChucVu + (luongNghachBacGoc * pcVuotKhungPct / 100);

    const pcUuDai = gocPhuCap * pcUuDaiPct / 100;
    const pcThamNien = gocPhuCap * pcThamNienPct / 100;

    const tongThuNhap = luongChinhDacThu + pcUuDai + pcThamNien + pcChucVu + pcKhuVuc + pcTrachNhiem + pcDocHai;

    const gocDongBH = luongNghachBacGoc + pcChucVu + pcThamNien;
    const bhxh = gocDongBH * 0.08;
    const bhyt = gocDongBH * 0.015;
    const bhtn = gocDongBH * 0.01;
    const thucNhan = tongThuNhap - bhxh - bhyt - bhtn;

    const ngay = new Date().toLocaleDateString('vi-VN');
    const hoTen = document.getElementById('hoTen').value;
    const donVi = document.getElementById('donVi').value;
    const ghiChu = document.getElementById('ghiChu').value;

    // Tạo bản phiếu lương thứ nhất
    const phieuMot = taoNoiDungPhieu(hoTen, donVi, ngay, hsl, hsDacThu, luongChinhDacThu, pcUuDai, pcThamNien, pcChucVu, pcKhuVuc, pcTrachNhiem, pcDocHai, tongThuNhap, bhxh, bhyt, bhtn, thucNhan, ghiChu);
    
    // Tạo bản phiếu lương thứ hai (nhân bản để in vừa 1 trang A4)
    const phieuHai = taoNoiDungPhieu(hoTen, donVi, ngay, hsl, hsDacThu, luongChinhDacThu, pcUuDai, pcThamNien, pcChucVu, pcKhuVuc, pcTrachNhiem, pcDocHai, tongThuNhap, bhxh, bhyt, bhtn, thucNhan, ghiChu);

    const đườngCắt = `
        <div class="cut-line">
            <span>✂ Đường cắt chia đôi tờ A4 (Khổ A5)</span>
        </div>
    `;

    const ketQua = document.getElementById('ketQua');
    ketQua.innerHTML = phieuMot + đườngCắt + phieuHai;
    ketQua.style.display = 'block';
    
    ketQua.scrollIntoView({ behavior: 'smooth' });
}

function xoaDuLieu(){
    location.reload();
}

capNhatGiaoDien();

</script>

</body>
</html>
